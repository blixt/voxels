[package]
name = "voxels-world"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "voxels_world"

[features]
default = []
terrain-page-builder = ["dep:meshopt"]

[dependencies]
blake3 = "1.8.7"
brotli = "9.0.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
meshopt = { version = "0.6.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "world"
harness = false
