[package]
name = "voxels-shell"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "voxels"
crate-type = ["cdylib", "rlib"]

[dependencies]
voxels-core = { path = "../core" }
voxels-world = { path = "../world" }
glam = "0.33.7"

[dev-dependencies]
voxels-render = { path = "../render" }
voxels-runtime = { path = "../runtime" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
voxels-client-config = { path = "../client-config" }
voxels-render = { path = "../render" }
voxels-runtime = { path = "../runtime" }
bytemuck = { version = "1.25.2", features = ["derive"] }
blake3 = "1.8.7"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.105"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.105"
features = [
  "console",
  "DedicatedWorkerGlobalScope",
  "OffscreenCanvas",
  "Performance",
  "BinaryType",
  "CloseEvent",
  "Event",
  "MessageEvent",
  "WebSocket",
  "WorkerGlobalScope",
]
